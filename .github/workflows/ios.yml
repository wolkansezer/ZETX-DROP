name: iOS → TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HAS_SECRETS: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Compile check (simulator, no signing)
        run: |
          cd ios
          xcodebuild build -project ZETXDrop.xcodeproj -scheme ZETXDrop \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Check secrets
        env:
          A: ${{ secrets.ASC_KEY_ID != '' }}
          B: ${{ secrets.ASC_ISSUER_ID != '' }}
          C: ${{ secrets.ASC_KEY_P8 != '' }}
          D: ${{ secrets.APPLE_TEAM_ID != '' }}
        run: |
          echo "ASC_KEY_ID=$A ASC_ISSUER_ID=$B ASC_KEY_P8=$C APPLE_TEAM_ID=$D"
          if [ "$HAS_SECRETS" != "true" ]; then
            echo "::warning::Eksik secret var: ASC_KEY_ID=$A ASC_ISSUER_ID=$B ASC_KEY_P8=$C APPLE_TEAM_ID=$D (Settings → Secrets and variables → Actions → Repository secrets)"
          fi

      - name: App Store Connect API key
        if: env.HAS_SECRETS == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          echo "KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          # Rebuild a clean PEM whatever way the key was pasted (missing header,
          # one long line, Windows line endings, spaces). Prints shape only, never the key.
          python3 - "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" <<'PY'
          import os, re, sys, base64
          raw = os.environ["ASC_KEY_P8"]
          had_header = "BEGIN PRIVATE KEY" in raw
          body = re.sub(r"-----(BEGIN|END)[^-]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          try:
              der = base64.b64decode(body, validate=True)
              ok = der[:1] == b"\x30"
          except Exception:
              ok = False
          print(f"p8 shape: header={had_header} lines={raw.count(chr(10))+1} base64_len={len(body)} valid_der={ok}")
          if not ok:
              print("::error::ASC_KEY_P8 geçersiz: .p8 dosyasını Not Defteri ile açıp TÜM metni (BEGIN/END satırları dahil) secret'a yeniden yapıştırın.")
              sys.exit(1)
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(body[i:i+64] for i in range(0, len(body), 64)) + "\n-----END PRIVATE KEY-----\n"
          open(sys.argv[1], "w").write(pem)
          PY

      - name: Archive
        if: env.HAS_SECRETS == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios
          BUILD=$(( ${{ github.run_number }} + 10 ))
          xcodebuild archive -project ZETXDrop.xcodeproj -scheme ZETXDrop -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ZETXDrop.xcarchive" \
            DEVELOPMENT_TEAM="$(printf %s "$TEAM" | tr -d "[:space:]")" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -quiet

      - name: Sign with Apple (cloud) and upload to TestFlight
        if: env.HAS_SECRETS == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cd ios
          sed "s/__TEAM_ID__/$(printf %s "$TEAM" | tr -d "[:space:]")/" ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ZETXDrop.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$(printf %s "$ASC_ISSUER_ID" | tr -d "[:space:]")"
          echo "::notice::Yüklendi. App Store Connect → TestFlight'ta 5-15 dk içinde görünür."

      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
