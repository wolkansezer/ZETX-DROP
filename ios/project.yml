name: ZETXDrop
options:
  bundleIdPrefix: com.zetx
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  ZETXDrop:
    type: application
    platform: iOS
    sources:
      - path: ZETXDrop
    settings:
      base:
        PRODUCT_NAME: ZETXDrop
        PRODUCT_BUNDLE_IDENTIFIER: om.zetx.drop
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
    info:
      path: ZETXDrop/Info.plist
      properties:
        CFBundleDisplayName: ZETX DROP
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: ZETX DROP, aynı Wi-Fi ağındaki bilgisayarları ve yakındaki iPhone'ları bulup dosya aktarmak için yerel ağı kullanır.
        NSBonjourServices:
          - _zetx-drop._tcp
          - _zetx-drop._udp
        NSPhotoLibraryAddUsageDescription: Gelen fotoğraf ve videoları doğrudan galerinize kaydetmek için.
        NSPhotoLibraryUsageDescription: Göndermek istediğiniz fotoğraf ve videoları seçmek için.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
